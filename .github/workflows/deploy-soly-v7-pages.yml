name: Deploy SOLY V7 to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "soly-v7/**"
      - ".github/workflows/deploy-soly-v7-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "soly-v7-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload SOLY V7
        uses: actions/upload-pages-artifact@v4
        with:
          path: soly-v7
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
