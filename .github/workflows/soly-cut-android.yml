name: Build Soly Cut Android APK
on:
  push:
    branches: [soly-cut-ci-20261031, soly-cut-v03]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Fetch upstream pinned ClearCut
        uses: actions/checkout@v4
        with:
          repository: SysAdminDoc/ClearCut
          ref: v3.82.0
          path: clearcut
      - name: Fetch Soly Cut customization
        uses: actions/checkout@v4
        with:
          path: solycut
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up current Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Apply isolated branding
        run: python3 solycut/customize.py clearcut
      - name: Install Soly smart reel test
        run: |
          cp solycut/solycut-v03/SolySmartReelPlannerTest.kt clearcut/app/src/test/java/com/novacut/editor/ai/SolySmartReelPlannerTest.kt
          python3 solycut/solycut-v03/apply_smart_reel.py clearcut solycut/solycut-v03
      - name: Focused smart reel policy test
        working-directory: clearcut
        run: |
          chmod +x gradlew
          ./gradlew :app:testQaUnitTest --tests 'com.novacut.editor.ai.SolySmartReelPlannerTest' --write-verification-metadata sha256 --no-daemon --stacktrace
      - name: Build debug installable APK
        working-directory: clearcut
        run: |
          chmod +x gradlew
          # Build-cache metadata from the pinned upstream may omit new Maven transitive artifacts.
          # Record SHA256 from fetched Maven artifacts, then enforce verification in the real build.
          ./gradlew :app:assembleDebug --write-verification-metadata sha256 --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK and SHA256
        run: |
          mkdir -p out
          if [ "$GITHUB_REF_NAME" = "soly-cut-v03" ]; then
            find clearcut/app/build/outputs/apk/debug -type f -name '*arm64*.apk' -exec cp {} out/ \;
          else
            find clearcut/app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} out/ \;
          fi
          test -n "$(find out -name '*.apk' -print -quit)"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: SolyCut-compact-ARM64-only
          path: out/SolyCut-compact-v0.2-arm64.apk
          if-no-files-found: error
          retention-days: 1
      - name: Verify and publish Soly Cut v0.3 Preview APK
        if: github.ref_name == 'soly-cut-v03'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find out -type f -name '*arm64*.apk' -print -quit)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" | tail -1
          mkdir -p publish
          cp "$APK" publish/SolyCut-v0.3-arm64-v8a-debug.apk
          (cd publish && sha256sum *.apk > SHA256SUMS.txt)
          gh release create soly-cut-v0.3.0-preview \
            publish/SolyCut-v0.3-arm64-v8a-debug.apk publish/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Soly Cut v0.3 Smart Reel — Preview" \
            --notes "Experimental preview: automatic 30-second 5-source reel proposal, review-first apply, 9:16 1080p/25fps export preset. Existing music/overlays retained; no automatic new soundtrack or logo injection. Debug-signed; not yet tested on a physical phone." \
            --prerelease
